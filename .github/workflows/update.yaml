name: update-data

on:
  schedule:
    - cron: "17 6 * * 1-5"   # 한국시간 평일 15:17 (전 영업일 시세 반영 후)
  workflow_dispatch:          # Actions 탭에서 수동 실행

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python "$(ls scripts/*.py | head -n1)"

        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          MIN_CAP_EOK: "2000"
      - name: commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data.json
          git commit -m "data $(date -u +%F)" || echo "no changes"
          git push
